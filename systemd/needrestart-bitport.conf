# /etc/needrestart/conf.d/bitport.conf
# Bitport jobs are long migrations: never restart them because a library was upgraded.
# 13 Nov 2026 (account 3): an unattended upgrade restarted every bitport-* unit at 06:54 UTC; the DMS
# import was stopped mid-flight, started again during the network blip the same upgrade caused, and
# died on a DNS error. Restart them by a deploy, on an idle box, instead.
$nrconf{override_rc}{qr(^bitport-)} = 0;
