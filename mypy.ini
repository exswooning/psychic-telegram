# Deliberately permissive to start with.
#
# The codebase is annotated throughout but has never been type-checked, so a
# strict config would emit hundreds of errors on day one and the signal would
# be ignored. This settles for the checks that catch real bugs -- calling
# something that isn't there, returning the wrong shape -- and leaves the
# stricter flags commented for when the baseline is clean.
[mypy]
python_version = 3.10
ignore_missing_imports = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unreachable = True
# Enable these as the baseline is cleared:
# disallow_untyped_defs = True
# disallow_incomplete_defs = True
# warn_return_any = True
# strict_optional = True

# The fakes deliberately duck-type the Google client surface; annotating them
# to satisfy a checker would make them less readable without making them safer.
[mypy-tests.fakes]
ignore_errors = True
